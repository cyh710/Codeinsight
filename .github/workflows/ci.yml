name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: 测试
        # 测试不连网：conftest 里把模型/嵌入地址指到不可达端口，
        # 任何意外的真实调用都会失败而不是悄悄通过。
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 + 构建
        run: npm run build
      - name: 单元测试
        run: npm test
      - name: Lint
        run: npm run lint
