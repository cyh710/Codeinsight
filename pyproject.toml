[project]
name = "codeinsight"
version = "0.1.0"
description = "基于持续项目认知的智能代码理解与知识探索 Agent"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "numpy>=2.0",
    "jieba>=0.42",
    "PyYAML>=6.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
ci = "codeinsight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeinsight"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".pytest-tmp", ".venv", "node_modules"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge/concepts" = "codeinsight/knowledge/concepts"
"knowledge/learning" = "codeinsight/knowledge/learning"
