id: abstract-base
name: 抽象基类与协议：约定可以替换的能力
category: pattern
summary: 抽象基类定义子类应实现的能力，协议描述对象需要具备的结构。它们帮助上层依赖稳定接口，而不是绑定某个具体实现。例如，检索器只要求得到命中列表，就可以替换底层索引。接口还需要说明语义，不只是函数名字相同。
principles: abc.ABC 与 abstractmethod 可以阻止不完整子类被正常实例化。typing.Protocol 常用于结构化静态检查，不要求显式继承。运行时协议检查的能力有限，不能验证参数与返回语义。行号、分数方向、错误行为和线程约束都应写进接口约定。
tradeoffs: 稳定接口降低替换成本，却增加维护抽象的工作。只有一个简单实现时，不必为每个小函数建立类层次。对语言解析、模型服务、存储和工具等真实变化边界，清楚的接口通常有长期收益。
alternatives: 简单可调用对象、鸭子类型、Protocol 或显式适配器。
detection:
  import_names:
  - abc
  call_names: []
  attribute_names: []
  decorator_names:
  - abc.abstractmethod
  base_classes:
  - abc.ABC
  - typing.Protocol
  string_markers: []
references:
