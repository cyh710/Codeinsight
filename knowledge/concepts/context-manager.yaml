id: context-manager
name: 上下文管理器：把进入与退出配对
category: pattern
summary: 上下文管理器通过 with 把进入资源和退出清理配对。无论主体正常结束还是抛异常，都能按约定执行退出逻辑。它能管理文件、锁、连接或临时状态，但具体退出行为由对象决定，不能只看到 with
  就认定事务已提交。
principles: 同步上下文协议包含 __enter__ 与 __exit__，异步协议对应 async with。contextlib 可以把带 yield 的函数转换为上下文管理器。退出时可能关闭资源、提交、回滚或恢复状态，是否抑制异常也由实现决定。理解一个
  with 应继续追对象类型与退出方法。
tradeoffs: with 减少重复 try/finally，但隐藏行为必须通过类型和 docstring 说清楚。过度包装会让锁和事务边界难看见。公开接口应明确资源由谁拥有、何时释放以及异常怎样传播。
alternatives: 显式 try/finally；复杂动态资源可使用 ExitStack。
detection:
  import_names:
  - contextlib
  call_names:
  - contextlib.closing
  - contextlib.ExitStack
  attribute_names: []
  decorator_names:
  - contextlib.contextmanager
  - contextlib.asynccontextmanager
  base_classes: []
  string_markers: []
references:
- https://docs.python.org/3.13/tutorial/
