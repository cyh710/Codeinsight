<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-labelledby="title description"><title id="title">打印与返回值</title><desc id="description">内部 print 显示 36；普通函数没有显式 return 且正常结束时返回 None，amount 因此是 None，外部 print 再显示 None。改用 return 可把 36 交给调用者。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6296af"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f6f9fb"/><g fill="#293f53" font-family="Microsoft YaHei,sans-serif"><text x="220" y="36" font-size="22" text-anchor="middle">打印与返回值经过不同的出口</text><rect x="45" y="62" width="350" height="56" rx="6" fill="#e6f3f9" stroke="#cfdee8"/><text x="220" y="97" font-size="20" text-anchor="middle">calculate_total(12, 3)</text><path d="M220,118 L220,148" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="45" y="152" width="350" height="56" rx="6" fill="#fff" stroke="#cfdee8"/><text x="220" y="187" font-size="20" text-anchor="middle">函数内 print(36)</text><text x="220" y="237" font-size="19" text-anchor="middle">屏幕先显示：36</text><path d="M220,248 L220,278" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="45" y="282" width="350" height="56" rx="6" fill="#fff" stroke="#cfdee8"/><text x="220" y="317" font-size="20" text-anchor="middle">无 return，正常结束</text><path d="M220,338 L220,368" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="45" y="372" width="350" height="56" rx="6" fill="#e6f3f9" stroke="#cfdee8"/><text x="220" y="407" font-size="20" text-anchor="middle">调用者拿到 None</text><path d="M220,428 L220,458" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="220" y="490" font-size="20" text-anchor="middle">外部 print(amount) 显示：None</text><text x="220" y="529" font-size="19" text-anchor="middle">改用 return 才把 36 交给调用者</text></g></svg>
