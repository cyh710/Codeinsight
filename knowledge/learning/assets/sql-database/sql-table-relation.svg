<svg xmlns="http://www.w3.org/2000/svg" width="440" height="590" viewBox="0 0 440 590" role="img" aria-labelledby="title description"><title id="title">商品与订单的引用关系</title><desc id="description">orders.product_id 引用 products.id；101 和 102 都引用商品 1，103 引用商品 2。箭头表示外键引用，不是执行顺序。SQL 声明并启用约束，画线本身不创建约束。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6296af"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f6f9fb"/><g fill="#293f53" font-family="Microsoft YaHei,sans-serif"><text x="30" y="38" font-size="21" text-anchor="start">products · 被引用的商品</text><rect x="30" y="54" width="380" height="40" fill="#e6f3f9" stroke="#d8e4ec"/><text x="93" y="80" font-size="19" text-anchor="middle">id</text><text x="219" y="80" font-size="19" text-anchor="middle">name</text><text x="345" y="80" font-size="19" text-anchor="middle">price</text><rect x="30" y="94" width="380" height="40" fill="#fff" stroke="#d8e4ec"/><text x="93" y="120" font-size="19" text-anchor="middle">1</text><text x="219" y="120" font-size="19" text-anchor="middle">笔记本</text><text x="345" y="120" font-size="19" text-anchor="middle">12.0</text><rect x="30" y="134" width="380" height="40" fill="#fff" stroke="#d8e4ec"/><text x="93" y="160" font-size="19" text-anchor="middle">2</text><text x="219" y="160" font-size="19" text-anchor="middle">钢笔</text><text x="345" y="160" font-size="19" text-anchor="middle">35.0</text><path d="M220,314 L220,206" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="235" y="248" font-size="19" text-anchor="start">外键引用</text><text x="235" y="278" font-size="18" text-anchor="start">不是执行顺序</text><text x="30" y="342" font-size="21" text-anchor="start">orders · 通过 product_id 找商品</text><rect x="30" y="358" width="380" height="40" fill="#e6f3f9" stroke="#d8e4ec"/><text x="93" y="384" font-size="19" text-anchor="middle">id</text><text x="219" y="384" font-size="19" text-anchor="middle">product_id</text><text x="345" y="384" font-size="19" text-anchor="middle">quantity</text><rect x="30" y="398" width="380" height="40" fill="#fff" stroke="#d8e4ec"/><text x="93" y="424" font-size="19" text-anchor="middle">101</text><text x="219" y="424" font-size="19" text-anchor="middle">1</text><text x="345" y="424" font-size="19" text-anchor="middle">2</text><rect x="30" y="438" width="380" height="40" fill="#fff" stroke="#d8e4ec"/><text x="93" y="464" font-size="19" text-anchor="middle">102</text><text x="219" y="464" font-size="19" text-anchor="middle">1</text><text x="345" y="464" font-size="19" text-anchor="middle">1</text><rect x="30" y="478" width="380" height="40" fill="#fff" stroke="#d8e4ec"/><text x="93" y="504" font-size="19" text-anchor="middle">103</text><text x="219" y="504" font-size="19" text-anchor="middle">2</text><text x="345" y="504" font-size="19" text-anchor="middle">1</text><text x="220" y="560" font-size="19" text-anchor="middle">订单 101、102 引用同一个商品 1</text></g></svg>
