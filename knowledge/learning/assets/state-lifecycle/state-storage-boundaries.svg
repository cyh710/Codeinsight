<svg xmlns="http://www.w3.org/2000/svg" width="440" height="602" viewBox="0 0 440 602" role="img" aria-labelledby="title description"><title id="title">状态与存储的层级</title><desc id="description">按职责分为浏览器与后端。浏览器包含页面内存及 localStorage/IndexedDB；后端包含进程内存和 SQLite 等数据文件。刷新页面与重启后端影响不同对象。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6296af"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f6f9fb"/><g fill="#293f53" font-family="Microsoft YaHei,sans-serif"><text x="220" y="38" font-size="23" text-anchor="middle">状态的逻辑归属</text><rect x="45" y="65" width="350" height="56" rx="6" fill="#e6f3f9" stroke="#cfdee8"/><text x="220" y="100" font-size="20" text-anchor="middle">一次应用运行</text><path d="M50 121V438H75M50 205H75" fill="none" stroke="#a4bdcc" stroke-width="2"/><rect x="75" y="157" width="330" height="178" rx="7" fill="#fff" stroke="#cfdee8"/><text x="95" y="191" font-size="22" text-anchor="start">浏览器侧</text><text x="95" y="231" font-size="19" text-anchor="start">页面内存：组件状态 / store</text><text x="95" y="271" font-size="19" text-anchor="start">浏览器存储：localStorage</text><text x="95" y="304" font-size="19" text-anchor="start">与 IndexedDB</text><rect x="75" y="374" width="330" height="155" rx="7" fill="#fff" stroke="#cfdee8"/><text x="95" y="408" font-size="22" text-anchor="start">后端侧</text><text x="95" y="449" font-size="19" text-anchor="start">进程内存：任务 / 临时缓存</text><text x="95" y="491" font-size="19" text-anchor="start">数据文件：SQLite / 索引</text><text x="220" y="574" font-size="19" text-anchor="middle">包含关系不等于相同生命周期</text></g></svg>
