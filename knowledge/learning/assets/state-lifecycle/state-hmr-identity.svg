<svg xmlns="http://www.w3.org/2000/svg" width="440" height="524" viewBox="0 0 440 524" role="img" aria-labelledby="title description"><title id="title">HMR 中的容器身份</title><desc id="description">事故中模块重新创建空 store，而启动初始化未重跑，项目从 4 变成 0。修复复用 hot.data 中的完整容器，保留状态及闭包；它不提供网页刷新后的持久化。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6296af"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f6f9fb"/><g fill="#293f53" font-family="Microsoft YaHei,sans-serif"><text x="220" y="38" font-size="21" text-anchor="middle">模块再次执行，不等于原状态仍在</text><rect x="45" y="65" width="350" height="56" rx="6" fill="#e6f3f9" stroke="#cfdee8"/><text x="220" y="100" font-size="20" text-anchor="middle">已有 store：4 个项目</text><path d="M220,121 L220,151" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="220" y="182" font-size="20" text-anchor="middle">发生开发期 HMR</text><path d="M200,205 L122,249" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M240,205 L320,249" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="25" y="265" width="180" height="56" rx="6" fill="#fff" stroke="#cfdee8"/><text x="115" y="300" font-size="20" text-anchor="middle">重新创建 store</text><rect x="235" y="265" width="180" height="56" rx="6" fill="#e6f3f9" stroke="#cfdee8"/><text x="325" y="300" font-size="20" text-anchor="middle">复用原 store</text><path d="M115,321 L115,364" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M325,321 L325,364" stroke="#6296af" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="115" y="396" font-size="20" text-anchor="middle">新对象：0 项</text><text x="325" y="396" font-size="20" text-anchor="middle">同一对象：4 项</text><text x="115" y="434" font-size="18" text-anchor="middle">初始化没有重跑</text><text x="325" y="434" font-size="18" text-anchor="middle">hot.data 保留身份</text><text x="220" y="493" font-size="19" text-anchor="middle">此机制服务开发热更新，不跨整页刷新</text></g></svg>
